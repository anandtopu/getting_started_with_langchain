[build-system]
requires = ["hatchling>=1.33.0,<1.34.0"]
build-backend = "hatchling.build"

[project]
name = "getting-started-with-langchain"
version = "1.0.0"
description = "A hands-on LangChain and LangGraph course built around Brightwave Outfitters"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "langchain>=1.4.7,<1.5.0",
  "langchain-core>=1.7.1,<1.8.0",
  "langgraph>=1.2.18,<1.3.0",
  "langchain-text-splitters>=1.1.3,<1.2.0",
  "langchain-openai>=1.7.3,<1.8.0",
  "langchain-anthropic>=1.7.7,<1.8.0",
  "langchain-google-genai>=4.4.2,<4.5.0",
  "langchain-ollama>=1.1.0,<1.2.0",
  "langsmith>=0.14.14,<0.15.0",
  "pydantic>=2.14.1,<2.15.0",
  "pydantic-settings>=2.16.2,<2.17.0",
  "python-dotenv>=1.2.4,<1.3.0",
  "httpx>=0.28.1,<0.29.0",
  "rich>=15.0.0,<15.1.0",
  "numpy>=2.5.4,<2.6.0",
]

[project.optional-dependencies]
foundations = []
rag = [
  "langchain-chroma>=1.1.0,<1.2.0",
  "pypdf>=6.21.4,<6.22.0",
  "rank-bm25>=0.2.2,<0.3.0",
  "numpy>=2.5.4,<2.6.0",
  "matplotlib>=3.11.2,<3.12.0",
]
agents = [
  "getting-started-with-langchain[rag]",
  "langgraph-checkpoint-sqlite>=3.1.2,<3.2.0",
  "langchain[mcp]>=1.4.7,<1.5.0",
  "fastmcp>=4.1.4,<4.2.0",
  "mcp>=2.3.0,<2.4.0",
  "httpx2>=2.16.0,<2.17.0",
]
apps = [
  "getting-started-with-langchain[agents]",
  "fastapi>=0.162.0,<0.163.0",
  "uvicorn>=0.54.0,<0.55.0",
  "streamlit>=1.66.1,<1.67.0",
]
deep = ["getting-started-with-langchain[agents]", "deepagents>=0.7.32,<0.8.0"]
search = ["langchain-tavily>=0.2.18,<0.3.0"]
deployment = [
  "getting-started-with-langchain[apps]",
  "langgraph-cli[inmem]>=0.4.40,<0.5.0",
  "langgraph-checkpoint-postgres>=3.2.0,<3.3.0",
  "psycopg[binary]>=3.3.6,<3.4.0",
]

[dependency-groups]
dev = ["pytest>=9.2.0,<9.3.0", "pytest-asyncio>=1.4.1,<1.5.0", "ruff>=0.17.3,<0.18.0"]
authoring = [
  "pre-commit>=4.7.0,<4.8.0",
  "nbstripout>=0.9.1,<0.10.0",
  "jupyter>=1.1.1,<1.2.0",
  "reportlab>=5.1.0,<5.2.0",
  "pypdf>=6.21.4,<6.22.0",
  "matplotlib>=3.11.2,<3.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules", "capstones", "checkpoints"]
addopts = "-ra --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: real provider or external service; opt in with --live"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".runtime", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Independent notebook cells intentionally mirror script imports and redefine main.
"*.ipynb" = ["E402", "F811", "F401"]

[tool.uv]
default-groups = ["dev"]
